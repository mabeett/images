---
name: automatic PR for new release

on:
  workflow_dispatch:
    inputs:
      ee-name:
        description: 'EE name'
        required: true
        type: choice
        options:
          - community-ee-base
          - community-ee-minimal
      ansible-core-version:
        description: >-
          Ansible-core version. Example: 2.20.0
        default: latest
  # Run daily (Monday at 08:00 UTC)
  # schedule:
  #   - cron: '0 8 * * *'

jobs:
  build:
    name: 'Build ansible-test images (${{ matrix.name }} with Python ${{ matrix.python }})'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Define ansible-core version
        id: get_version
        run: |
          ANSIBLE_CORE_VERSION="${{inputs.ansible-core-version}}"
          if [[ ${{inputs.ansible-core-version}} == 'latest' ]]; then
            ANSIBLE_CORE_VERSION=$(curl -sSf "https://pypi.org/pypi/ansible/json" | jq -r '.info.version')
          fi
          echo "ANSIBLE_CORE_VERSION=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Use the version
        run: echo "ansible-core version is ${ANSIBLE_CORE_VERSION}"

      - name: Check out ansible-build-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ansible-community/ansible-build-data
          ref: main
          path: ansible-build-data
          persist-credentials: false

      #TODO: find the match to the latest ansible-core version 
      ## _ansible_core_version: 2.21.3
      - name: get the latest ansible community version deps file
        run: |
          DEPS_FILE=$( find ansible-build-data/ -type f -name ansible-\*\.deps \
            -exec grep -E -l '^_ansible_core_version: '"${ANSIBLE_CORE_VERSION}"'$' {} \; \
          	| while read -r line; do
              ver=$(echo "$line" | sed -n 's/.*ansible-\([0-9.]\+[a-z0-9]*\)\.deps/\1/p')
              tver=$(echo "$ver" \
                  | sed 's/a\([0-9][0-9]*\)/~alpha\1/g' \
                  | sed 's/b\([0-9][0-9]*\)/~beta\1/g'  \
                  | sed 's/rc\([0-9][0-9]*\)/~rc\1/g')
              echo "$tver $line"
          done  | sort -V | sed 's/^[^ ]* //' | tail -n 1 )
          echo "DEPS_FILE=${DEPS_FILE}" >> "$GITHUB_OUTPUT"
        shell: bash

      # ansible.posix, ansible.utils and ansible.windows
      - name: Get ansible.posix, ansible.utils and ansible.windows versions
        working-directory: ansible-build-data
        run: |
          echo ansible_posix_version=$( grep -E -h '^ansible.posix:' ${DEPS_FILE} | tail -1 | awk '{print $2}' )  >> "$GITHUB_OUTPUT"
          echo ansible_utils_version=$( grep -E -h '^ansible.utils:' ${DEPS_FILE} | tail -1 | awk '{print $2}' )  >> "$GITHUB_OUTPUT"
          echo ansible_windows_version=$( grep -E -h '^ansible.windows:' ${DEPS_FILE} | tail -1 | awk '{print $2}' )  >> "$GITHUB_OUTPUT"
        shell: bash

      - name: debug
        working-directory: ansible-build-data
        run: |
          env
        shell: bash
